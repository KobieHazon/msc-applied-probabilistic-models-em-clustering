[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msc-applied-probabilistic-models-em-clustering"
version = "1.0.0"
description = "Expectation-maximization clustering of Reuters-derived articles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kobie Hazon" },
]
dependencies = [
    "numpy>=1.24,<3",
]

[project.scripts]
apm-em-cluster = "solution.ex3:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["solution"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: runs the complete supplied corpus workflow",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
